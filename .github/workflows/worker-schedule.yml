name: Scheduled Notice Worker

on:
  schedule:
    # Run every 30 minutes on free-tier runner
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      college_id:
        description: 'Optional College UUID filter'
        required: false
        type: string

concurrency:
  group: worker-execution-lock
  cancel-in-progress: false

jobs:
  run-worker:
    name: Crawl & Extract Notices
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt

      - name: Execute Notice Worker
        env:
          PYTHONPATH: .
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          WORKER_LOG_LEVEL: INFO
          WORKER_USER_AGENT: NotifyBot/1.0 (+https://github.com/${{ github.repository }})
        run: |
          python -m worker.main ${{ github.event.inputs.college_id }}
