[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notify-worker"
version = "1.0.0"
description = "Notify college website notice monitoring & rule-based extraction service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "beautifulsoup4>=4.12.3",
    "feedparser>=6.0.11",
    "pymupdf>=1.25.3",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.0",
    "firebase-admin>=6.6.0",
    "python-dotenv>=1.0.1",
    "lxml>=5.3.0",
    "supabase>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
